services:
  # Aplikacja: PHP + Apache z Dockerfile
  app:
    build: .
    ports:
      - "8080:80"            # strona dostępna pod http://localhost:8080
    volumes:
      - .:/var/www           # kod podpięty na żywo: edytujesz lokalnie, zmiany od razu w kontenerze
      #volumes to bind (kropka jest istotna,czyli tam gdzie leży compose); bez tego folder powstałby tylko w kontenerze i zniknął by po docker compose down

  # Baza danych
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql   # dane bazy przetrwają restart i usunięcie kontenera

  # Podgląd bazy w przeglądarce
  adminer:
    image: adminer
    ports:
      - "8081:8080"          # http://localhost:8081, serwer: db

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  db_data:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
